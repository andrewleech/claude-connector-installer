name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # version = "git" in picolet.toml runs `git describe`, which needs
          # the full history and tags. A shallow clone gives 0.0.0.dev builds.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      # The PyPI release predates the [app] version/icon/console options.
      - name: Install picolet and mpy-cross
        run: |
          uv tool install mpy-cross
          uv tool install "git+https://github.com/andrewleech/picolet@dev#subdirectory=packages/picolet"

      - name: Build
        run: picolet build --target windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: claude-connector-installer
          path: target/windows-x64/claude-connector-installer.exe*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: claude-connector-installer

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            claude-connector-installer.exe*
